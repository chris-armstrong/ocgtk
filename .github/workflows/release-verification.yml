name: Release Verification

# Manually triggered, or automatically on release tags.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  OCAML_VERSION: '5.3.0'
  OPAM_VERSION: '2.5.0'

permissions:
  contents: write   # needed by the `package` job to publish a GitHub Release

jobs:

  # ── Ubuntu 22.04 (native runner) ────────────────────────────────────────────
  ubuntu-22:
    name: Ubuntu 22.04
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc make m4 patch unzip bzip2 curl git pkg-config perl diffutils rsync \
            libgtk-4-dev libcairo2-dev libpango1.0-dev libgdk-pixbuf-2.0-dev libglib2.0-dev \
            libgirepository1.0-dev gir1.2-gtk-4.0 xvfb
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}
      - name: Pin conf-gtk4 and install dependencies
        run: |
          opam pin add -n conf-gtk4 conf-gtk4
          opam install --deps-only --with-test -y . ./ocgtk ./gir_gen
      - name: Build
        run: opam exec -- dune build
      - name: Test gir_gen
        run: opam exec -- dune test gir_gen/
      - name: Test ocgtk
        run: opam exec -- xvfb-run -a dune test ocglib/ ocgtk/

  # ── Ubuntu 24.04 (native runner) ────────────────────────────────────────────
  ubuntu-24:
    name: Ubuntu 24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc make m4 patch unzip bzip2 curl git pkg-config perl diffutils rsync \
            libgtk-4-dev libcairo2-dev libpango1.0-dev libgdk-pixbuf-2.0-dev libglib2.0-dev \
            libgirepository1.0-dev gir1.2-gtk-4.0 xvfb
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}
      - name: Pin conf-gtk4 and install dependencies
        run: |
          opam pin add -n conf-gtk4 conf-gtk4
          opam install --deps-only --with-test -y . ./ocgtk ./gir_gen
      - name: Build
        run: opam exec -- dune build
      - name: Test gir_gen
        run: opam exec -- dune test gir_gen/
      - name: Test ocgtk
        run: opam exec -- xvfb-run -a dune test ocglib/ ocgtk/

  # ── APT-based containers (Ubuntu 26.04, 26.10, Debian 12, 13) ───────────────
  linux-apt:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 26.04
            image: ubuntu:26.04
          - name: Ubuntu 26.10
            image: ubuntu:26.10
          - name: Debian 12
            image: debian:12
          - name: Debian 13
            image: debian:13
    steps:
      - name: Install git and curl
        run: apt-get update && apt-get install -y git curl ca-certificates
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          apt-get install -y \
            gcc make m4 patch unzip bzip2 pkg-config perl diffutils rsync \
            libgtk-4-dev libcairo2-dev libpango1.0-dev libgdk-pixbuf-2.0-dev libglib2.0-dev \
            libgirepository1.0-dev gir1.2-gtk-4.0 xvfb
      # The checkout is owned by the runner user, not the container's root,
      # and opam pins the repository root with git, which refuses it then.
      - name: Trust the checkout for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install opam
        run: |
          curl -fsSL \
            "https://github.com/ocaml/opam/releases/download/${{ env.OPAM_VERSION }}/opam-${{ env.OPAM_VERSION }}-x86_64-linux" \
            -o /usr/local/bin/opam
          chmod +x /usr/local/bin/opam
      - name: Initialise opam and create switch
        run: |
          opam init --disable-sandboxing -y --bare
          opam switch create default "ocaml-base-compiler.${{ env.OCAML_VERSION }}" -y
      - name: Pin conf-gtk4 and install OCaml dependencies
        run: |
          eval $(opam env)
          opam pin add -n conf-gtk4 conf-gtk4
          opam install --deps-only --with-test -y . ./ocgtk ./gir_gen
      - name: Build
        run: |
          eval $(opam env)
          dune build
      - name: Test gir_gen
        run: |
          eval $(opam env)
          dune test gir_gen/
      - name: Test ocgtk
        run: |
          eval $(opam env)
          xvfb-run -a dune test ocglib/ ocgtk/

  # ── Fedora containers (Fedora 43, Fedora 44) ─────────────────────────────────
  linux-fedora:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora 43
            image: fedora:43
          - name: Fedora 44
            image: fedora:44
    steps:
      - name: Install git and curl
        run: dnf install -y git curl
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          dnf install -y \
            gcc make m4 patch unzip bzip2 pkgconf perl diffutils which rsync \
            gtk4-devel cairo-devel pango-devel gdk-pixbuf2-devel glib2-devel \
            gobject-introspection-devel xorg-x11-server-Xvfb
      # The checkout is owned by the runner user, not the container's root,
      # and opam pins the repository root with git, which refuses it then.
      - name: Trust the checkout for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install opam
        run: |
          curl -fsSL \
            "https://github.com/ocaml/opam/releases/download/${{ env.OPAM_VERSION }}/opam-${{ env.OPAM_VERSION }}-x86_64-linux" \
            -o /usr/local/bin/opam
          chmod +x /usr/local/bin/opam
      - name: Initialise opam and create switch
        run: |
          opam init --disable-sandboxing -y --bare
          opam switch create default "ocaml-base-compiler.${{ env.OCAML_VERSION }}" -y
      - name: Pin conf-gtk4 and install OCaml dependencies
        run: |
          eval $(opam env)
          opam pin add -n conf-gtk4 conf-gtk4
          opam install --deps-only --with-test -y . ./ocgtk ./gir_gen
      - name: Build
        run: |
          eval $(opam env)
          dune build
      - name: Test gir_gen
        run: |
          eval $(opam env)
          dune test gir_gen/
      - name: Test ocgtk
        run: |
          eval $(opam env)
          xvfb-run -a dune test ocglib/ ocgtk/

  # ── CentOS Stream containers (Stream 9, Stream 10) ───────────────────────────
  #
  # Stream 10 has no Xvfb (RHEL 10 dropped the Xorg server): its tests run
  # under xwfb-run (xwayland-run) with mutter as the headless compositor.
  linux-centos:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CentOS Stream 9
            image: quay.io/centos/centos:stream9
            display_packages: xorg-x11-server-Xvfb
            display_run: xvfb-run -a
          - name: CentOS Stream 10
            image: quay.io/centos/centos:stream10
            display_packages: xwayland-run mutter
            display_run: xwfb-run -c mutter --
    steps:
      - name: Enable EPEL + CRB and install git/curl
        run: |
          dnf install -y epel-release dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y --allowerasing git curl
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          dnf install -y --allowerasing \
            gcc make m4 patch unzip bzip2 pkgconf-pkg-config perl diffutils which rsync \
            gtk4-devel cairo-devel pango-devel gdk-pixbuf2-devel glib2-devel \
            gobject-introspection-devel ${{ matrix.display_packages }}
      # The checkout is owned by the runner user, not the container's root,
      # and opam pins the repository root with git, which refuses it then.
      - name: Trust the checkout for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install opam
        run: |
          curl -fsSL \
            "https://github.com/ocaml/opam/releases/download/${{ env.OPAM_VERSION }}/opam-${{ env.OPAM_VERSION }}-x86_64-linux" \
            -o /usr/local/bin/opam
          chmod +x /usr/local/bin/opam
      - name: Initialise opam and create switch
        run: |
          opam init --disable-sandboxing -y --bare
          opam switch create default "ocaml-base-compiler.${{ env.OCAML_VERSION }}" -y
      - name: Pin conf-gtk4 and install OCaml dependencies
        run: |
          eval $(opam env)
          opam pin add -n conf-gtk4 conf-gtk4
          opam install --deps-only --with-test -y . ./ocgtk ./gir_gen
      - name: Build
        run: |
          eval $(opam env)
          dune build
      - name: Test gir_gen
        run: |
          eval $(opam env)
          dune test gir_gen/
      - name: Test ocgtk
        run: |
          eval $(opam env)
          ${{ matrix.display_run }} dune test ocglib/ ocgtk/

  # ── openSUSE containers (Leap 16.0, Tumbleweed) ──────────────────────────────
  linux-opensuse:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: openSUSE Leap 16.0
            image: opensuse/leap:16.0
          - name: openSUSE Tumbleweed
            image: opensuse/tumbleweed:latest
    steps:
      - name: Install git and curl
        run: zypper install -y git curl
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          zypper install -y \
            gcc make m4 patch unzip bzip2 gzip tar pkg-config pkgconf perl diffutils which rsync \
            gtk4-devel cairo-devel pango-devel gdk-pixbuf-devel glib2-devel \
            gobject-introspection-devel xorg-x11-server-Xvfb xvfb-run
      # The checkout is owned by the runner user, not the container's root,
      # and opam pins the repository root with git, which refuses it then.
      - name: Trust the checkout for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install opam
        run: |
          curl -fsSL \
            "https://github.com/ocaml/opam/releases/download/${{ env.OPAM_VERSION }}/opam-${{ env.OPAM_VERSION }}-x86_64-linux" \
            -o /usr/local/bin/opam
          chmod +x /usr/local/bin/opam
      - name: Initialise opam and create switch
        run: |
          opam init --disable-sandboxing -y --bare
          opam switch create default "ocaml-base-compiler.${{ env.OCAML_VERSION }}" -y
      - name: Pin conf-gtk4 and install OCaml dependencies
        run: |
          eval $(opam env)
          opam pin add -n conf-gtk4 conf-gtk4
          opam install --deps-only --with-test -y . ./ocgtk ./gir_gen
      - name: Build
        run: |
          eval $(opam env)
          dune build
      - name: Test gir_gen
        run: |
          eval $(opam env)
          dune test gir_gen/
      - name: Test ocgtk
        run: |
          eval $(opam env)
          xvfb-run -a dune test ocglib/ ocgtk/

  # ── Alpine 3.24 ──────────────────────────────────────────────────────────────
  linux-alpine:
    name: Alpine 3.24
    runs-on: ubuntu-latest
    container: alpine:3.24
    steps:
      - name: Install git and curl
        run: apk add git curl bash
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          apk add \
            build-base m4 patch unzip bzip2 pkgconf perl diffutils rsync \
            gtk4.0-dev cairo-dev pango-dev gdk-pixbuf-dev glib-dev \
            gobject-introspection-dev xvfb-run
      # The checkout is owned by the runner user, not the container's root,
      # and opam pins the repository root with git, which refuses it then.
      - name: Trust the checkout for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install opam
        run: |
          curl -fsSL \
            "https://github.com/ocaml/opam/releases/download/${{ env.OPAM_VERSION }}/opam-${{ env.OPAM_VERSION }}-x86_64-linux" \
            -o /usr/local/bin/opam
          chmod +x /usr/local/bin/opam
      - name: Initialise opam and create switch
        run: |
          opam init --disable-sandboxing -y --bare
          opam switch create default "ocaml-base-compiler.${{ env.OCAML_VERSION }}" -y
      - name: Pin conf-gtk4 and install OCaml dependencies
        run: |
          eval $(opam env)
          opam pin add -n conf-gtk4 conf-gtk4
          opam install --deps-only --with-test -y . ./ocgtk ./gir_gen
      - name: Build
        run: |
          eval $(opam env)
          dune build
      - name: Test gir_gen
        run: |
          eval $(opam env)
          dune test gir_gen/
      - name: Test ocgtk
        run: |
          eval $(opam env)
          xvfb-run -a dune test ocglib/ ocgtk/

  # ── Arch Linux (rolling) ─────────────────────────────────────────────────────
  linux-arch:
    name: Arch Linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install git and curl
        run: pacman -Syu --noconfirm --needed git curl
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          pacman -S --noconfirm --needed \
            base-devel unzip rsync \
            gtk4 cairo pango gdk-pixbuf2 glib2 \
            gobject-introspection xorg-server-xvfb
      # The checkout is owned by the runner user, not the container's root,
      # and opam pins the repository root with git, which refuses it then.
      - name: Trust the checkout for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install opam
        run: |
          curl -fsSL \
            "https://github.com/ocaml/opam/releases/download/${{ env.OPAM_VERSION }}/opam-${{ env.OPAM_VERSION }}-x86_64-linux" \
            -o /usr/local/bin/opam
          chmod +x /usr/local/bin/opam
      - name: Initialise opam and create switch
        run: |
          opam init --disable-sandboxing -y --bare
          opam switch create default "ocaml-base-compiler.${{ env.OCAML_VERSION }}" -y
      - name: Pin conf-gtk4 and install OCaml dependencies
        run: |
          eval $(opam env)
          opam pin add -n conf-gtk4 conf-gtk4
          opam install --deps-only --with-test -y . ./ocgtk ./gir_gen
      - name: Build
        run: |
          eval $(opam env)
          dune build
      - name: Test gir_gen
        run: |
          eval $(opam env)
          dune test gir_gen/
      - name: Test ocgtk
        run: |
          eval $(opam env)
          xvfb-run -a dune test ocglib/ ocgtk/

  # ── macOS (Homebrew) ─────────────────────────────────────────────────────────
  macos:
    name: macOS (Homebrew)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: brew install gtk4 gobject-introspection pkgconf
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}
      - name: Pin conf-gtk4 and install dependencies
        run: |
          opam pin add -n conf-gtk4 conf-gtk4
          opam install --deps-only --with-test -y . ./ocgtk ./gir_gen
      - name: Build
        run: opam exec -- dune build
      - name: Test gir_gen
        run: opam exec -- dune test gir_gen/
      - name: Test ocgtk
        run: opam exec -- dune test ocglib/ ocgtk/

  # ── macOS conf packages (Homebrew depexts) ───────────────────────────────────
  #
  # Installs each conf package through opam's Homebrew depexts, without
  # installing the libraries first, and checks that Homebrew's glib provides
  # every GLib module conf-glib-2 stands for.
  macos-conf:
    name: macOS conf packages (Homebrew)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}
          opam-pin: false
      - name: Libraries already installed
        run: brew list --versions glib cairo pango gdk-pixbuf graphene gtk4 || true
      - name: Install each conf package through depexts
        run: |
          for pkg in conf-cairo-gobject conf-pangocairo conf-gdk-pixbuf-2 conf-graphene-1 conf-gtk4; do
            opam install --confirm-level=unsafe-yes "./$pkg"
          done
      - name: GLib modules
        run: opam exec -- pkg-config --print-errors glib-2.0 gobject-2.0 gio-2.0 gio-unix-2.0

  # ── FreeBSD 14, 15 ───────────────────────────────────────────────────────────
  # Disabled: FreeBSD runs on QEMU on GitHub runners which lack processor
  # virtualisation extensions, making it too slow and prone to timeouts.
  freebsd:
    name: FreeBSD ${{ matrix.release }}
    if: false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ['14', '15']
    steps:
      - uses: actions/checkout@v4
      - name: Build and test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          usesh: true
          prepare: |
            pkg install -y \
              gtk4 gobject-introspection pkgconf \
              bash gcc gmake m4 patch unzip bzip2 curl git perl5 rsync \
              xorg-vfbserver
          run: |
            set -e
            curl -fsSL \
              "https://github.com/ocaml/opam/releases/download/${{ env.OPAM_VERSION }}/opam-${{ env.OPAM_VERSION }}-x86_64-freebsd" \
              -o /usr/local/bin/opam
            chmod +x /usr/local/bin/opam
            opam init --disable-sandboxing -y --bare
            opam switch create default "ocaml-base-compiler.${{ env.OCAML_VERSION }}" -y
            eval $(opam env)
            opam pin add -n conf-gtk4 conf-gtk4
            opam install --deps-only --with-test -y . ./ocgtk ./gir_gen
            dune build
            dune test gir_gen/
            # xvfb-run is not available on FreeBSD; start Xvfb manually
            Xvfb :99 -screen 0 1280x1024x24 &
            sleep 1
            DISPLAY=:99 dune test ocglib/ ocgtk/

  # ── Windows ──────────────────────────────────────────────────────────────────
  #
  # Disabled: no MSYS2 environment currently has both GTK4 and an opam OCaml.
  # MSYS2 deprecated MINGW64 and no longer ships mingw-w64-x86_64-gtk4; GTK4 is
  # in UCRT64, but opam-repository's mingw compiler packages still require
  # msys2-mingw64 (ocaml/opam-repository#29795 starts the UCRT64 work) and the
  # msys2 package rejects UCRT64 (ocaml/opam-repository#29447). setup-ocaml's
  # msys2 mode installs only the MINGW64 gcc.
  #
  # Before re-enabling: the OCaml compiler, shell and GTK4 libraries must all
  # live in the UCRT64 prefix, so setup-ocaml and opam need UCRT64 support,
  # and conf-gtk4 needs its MSYS2 depext back.
  #
  # Build only: GTK tests require a display; Windows CI validates compilation.
  windows:
    name: Windows (MSYS2/UCRT64)
    if: false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Install GTK4 and its dependencies into the MSYS2 UCRT64 prefix.
      - name: Install GTK4 via MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-gobject-introspection
            mingw-w64-ucrt-x86_64-pkgconf

      # windows-environment: msys2 uses the pre-installed MSYS2 as the build
      # shell, so pkg-config sees the MSYS2 packages without any path bridging.
      - name: Set up OCaml (mingw-w64 compiler, MSYS2 shell)
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}
          windows-compiler: mingw
          windows-environment: msys2

      - name: Pin conf-gtk4 and install OCaml dependencies
        run: |
          opam pin add -n conf-gtk4 conf-gtk4
          opam install --deps-only -y . ./ocgtk

      - name: Build
        run: opam exec -- dune build @ocgtk/install

  # ── Package + publish release ────────────────────────────────────────────────
  #
  # Only fires on an actual tag push (not workflow_dispatch), and only after
  # every platform verification job above has passed. Builds a tarball whose
  # root is the `ocgtk/` subtree (so dune-project / *.install end up at the
  # tarball root, where opam expects them) plus LICENSE/LGPL, and publishes it
  # as a GitHub Release asset. opam-repository submissions must point url.src
  # at this asset, not GitHub's auto-generated "Source code" archive, which
  # still contains the whole monorepo.
  package:
    name: Package release tarball
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - ubuntu-22
      - ubuntu-24
      - linux-apt
      - linux-fedora
      - linux-centos
      - linux-opensuse
      - linux-alpine
      - linux-arch
      - macos
      - macos-conf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build ocgtk-only release tarball
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="ocgtk-$VERSION"
          STAGE="$(mktemp -d)/$PKG"
          mkdir -p "$STAGE"

          # ocgtk/ subtree becomes the tarball root (fixes dune-project /
          # *.install being one directory too deep for opam).
          git archive "$GITHUB_REF_NAME:ocgtk" | tar -x -C "$STAGE"
          # Fold in the repo-root license files alongside it.
          git archive "$GITHUB_REF_NAME" -- LICENSE LGPL | tar -x -C "$STAGE"

          tar -czf "$PKG.tar.gz" -C "$(dirname "$STAGE")" "$PKG"
          sha256sum "$PKG.tar.gz" > "$PKG.tar.gz.sha256"

          echo "PKG=$PKG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          # Tag versions use '-' (v0.1-preview2); CHANGELOG headings use '~'
          # (## [0.1~preview2]), matching the dune-project/opam version format.
          # (not `${VERSION/-/~}`: bash tilde-expands a bare `~` produced by
          # parameter substitution, corrupting this into `$HOME`)
          CHANGELOG_VERSION=$(printf '%s' "$VERSION" | sed 's/-/~/')
          awk -v ver="$CHANGELOG_VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) { found=1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for version $CHANGELOG_VERSION"
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, 'preview') }}
          files: |
            ${{ env.PKG }}.tar.gz
            ${{ env.PKG }}.tar.gz.sha256
