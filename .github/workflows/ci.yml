name: CI
on:
  push:
    branches: [main]
  pull_request:
# CI Notes:
# - octk: GTK 4 support is under development, failures expected

jobs:

  build-ocgtk:
    name: Build ocgtk (GTK 4)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ocaml-compiler: [5.5.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true

      - name: Install external dependencies
        run: |
          sudo apt-get update &&
          sudo apt-get install -y libcairo2-dev libgtk-4-dev xdot xvfb

      - name: Pin the conf packages
        run: for p in conf-*/; do opam pin add -n -y "${p%/}" "./$p"; done

      - name: Install OCaml dependencies
        run: |
          opam install . ./gir_gen --deps-only --with-test

      # --check exits non-zero if any gir_gen source would be reformatted.
      - name: Check gir_gen formatting
        run: |
          opam exec -- ocamlformat --check \
            $(git ls-files 'gir_gen/*.ml' 'gir_gen/*.mli')

      - name: Build
        run: opam exec -- dune build

      - name: Test gir_gen package
        run: opam exec -- dune test gir_gen/

      - name: Test the bindings
        run: |
          # Use xvfb-run to provide virtual display for GTK runtime tests
          opam exec -- xvfb-run -a dune test

  # ── Packages (opam install) ────────────────────────────────────────────────
  # Installs every package the way opam does for a user: each is built with
  # `dune build -p <pkg>`, in dependency order, against the ones before it
  # already installed, and runs only its own tests (no display, as in
  # opam-repository's CI). Then builds and runs a program that depends only
  # on ocgtk against the installed set.
  opam-install:
    name: Install packages (opam)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.5.x
          opam-pin: false

      - name: Install external dependencies
        run: |
          sudo apt-get update &&
          sudo apt-get install -y libcairo2-dev libgtk-4-dev xvfb

      - name: Pin the conf packages
        run: for p in conf-*/; do opam pin add -n -y "${p%/}" "./$p"; done

      - name: Install every package
        run: opam install -y --with-test .

      - name: Build a program against the installed ocgtk
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          echo '(lang dune 3.0)' > dune-project
          echo '(executable (name consumer) (libraries ocgtk))' > dune
          cat > consumer.ml <<'EOF'
          let () =
            ignore (Ocgtk.Main.init ());
            let button = Ocgtk.Button.new_with_label "ocgtk" in
            let label = Ocgtk.Raw.Button.get_label button#as_button in
            let (_ : Ocgtk.Enums.orientation) = `HORIZONTAL in
            Printf.printf "%s, GTK %d.%d\n"
              (Option.value ~default:"" label)
              (Ocgtk.Version.runtime_major ())
              (Ocgtk.Version.runtime_minor ())
          EOF
          opam exec -- dune build ./consumer.exe
          opam exec -- xvfb-run -a dune exec ./consumer.exe

  # ── Lint (semgrep) — HARD GATE ─────────────────────────────────────────────
  # Runs semgrep (banned partial functions in .semgrep/banned-partials.yml) and
  # FAILS the workflow on any finding (`--error`). Uploads the JSON report on
  # failure too (the `if: always()` upload step) so a red run is debuggable.
  lint:
    name: Lint (semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.5.x
          dune-cache: true

      - name: Install external dependencies
        run: |
          sudo apt-get update &&
          sudo apt-get install -y libcairo2-dev libgtk-4-dev

      - name: Pin the conf packages
        run: for p in conf-*/; do opam pin add -n -y "${p%/}" "./$p"; done

      - name: Install OCaml dependencies
        run: opam install . ./gir_gen --deps-only --with-test

      - name: Install semgrep
        run: python3 -m pip install semgrep

      - name: Run semgrep (banned partial functions)
        run: |
          semgrep --config .semgrep/banned-partials.yml --json \
            > semgrep-report.json || true
          semgrep --config .semgrep/banned-partials.yml --error .

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: semgrep-report.json

  # ── macOS (Homebrew GTK4) ──────────────────────────────────────────────────
  # Validates the cmdliner --help=plain fix on macOS. Apple Silicon only
  # (macos-latest); macos-13 x86_64 runners no longer pick up public-repo jobs
  # reliably, so we can't mirror the opam-ci amd64 variant directly here — the
  # arm64 run still exercises the same cmdliner code path.
  build-ocgtk-macos:
    name: Build ocgtk (macOS ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest  # arm64 — Apple Silicon
            ocaml-compiler: 5.5.x

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install GTK4 via Homebrew
        run: |
          brew update
          brew install gtk4 gobject-introspection pkg-config cairo pango gdk-pixbuf

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true

      - name: Pin the conf packages
        run: for p in conf-*/; do opam pin add -n -y "${p%/}" "./$p"; done

      - name: Install OCaml dependencies
        run: |
          opam install . --deps-only --with-test
          opam install ./gir_gen --deps-only --with-test

      - name: Build
        run: opam exec -- dune build

      # Replicate opam-ci's non-TTY build-sandbox conditions:
      # stdout/stderr redirected (no isatty), TERM varied.
      - name: Run tests (opam-ci-style, TERM=dumb)
        env:
          TERM: dumb
        run: |
          opam exec -- dune test gir_gen/ 2>&1 | tee test-output-gir-gen.log
          opam exec -- dune test 2>&1 | tee test-output.log

      - name: Run tests again with TERM=xterm-256color (CLI help regression check)
        env:
          TERM: xterm-256color
        run: |
          opam exec -- dune test --force ocgtk/ 2>&1 | tee test-output-xterm.log

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.os }}-test-logs
          path: |
            test-output-gir-gen.log
            test-output.log
            test-output-xterm.log
            _build/default/gir_gen/test/_build/_tests/

